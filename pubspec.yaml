publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  provider: ^6.1.1
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
